<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subway Route Display</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <style>
      html,
      body {
        height: 100%;
      }
      #map {
        height: 100%;
      }
      .line-label {
        background: rgba(255, 255, 255, 0); /* Transparent background */
        border: 0;
        border-radius: 0px;
        box-shadow: 0 0px 0px; /* Remove shadow */
        color: black; /* Label text color */
        font-weight: bold;
        pointer-events: none; /* Allows clicks to pass through to the line feature */
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script
      type="text/javascript"
      src="/node_modules/leaflet-geometryutil/src/leaflet.geometryutil.js"
    ></script>
    <script
      type="text/javascript"
      src="/node_modules/leaflet-arrowheads/src/leaflet-arrowheads.js"
    ></script>
    <script src="leaflet.js"></script>
  </body>
</html>
